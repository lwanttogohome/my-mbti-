
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                   sans-serif;
      background: #fff8e7;
      color: #493b2a;
      font-size: 17px;
      line-height: 1.7;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 43px);
      line-height: 1.3;
      margin: 8px 0 12px;
      color: #5d4527;
    }

    .subtitle {
      color: #887451;
      font-size: 18px;
      margin: 0;
    }

    .panel {
      background: #fffdf6;
      border: 2px solid #f3dfae;
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 8px 0 #f4e6c7;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 25px;
      margin: 0 0 8px;
    }

    .hint {
      color: #8b795e;
      margin: 0 0 22px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .mbti-btn {
      border: 2px solid #efdcae;
      background: #fff8e5;
      color: #664d2d;
      border-radius: 14px;
      padding: 14px 4px;
      font-size: 20px;
      font-weight: 800;
      transition: 0.18s ease;
    }

    .mbti-btn:hover,
    .mbti-btn:focus-visible {
      background: #ffe8a3;
      border-color: #e6b94f;
      transform: translateY(-2px);
      outline: none;
    }

    .mbti-btn:active {
      transform: scale(0.97);
    }

    .result {
      display: none;
      text-align: center;
      animation: appear 0.35s ease;
    }

    .result.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .type-label {
      display: inline-block;
      background: #ffe8a3;
      color: #75541c;
      border-radius: 999px;
      padding: 6px 18px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .pokemon-emoji {
      font-size: clamp(95px, 18vw, 150px);
      line-height: 1.4;
      margin: 5px 0;
      filter: drop-shadow(0 7px 3px #eadbb8);
    }

    .pokemon-name {
      font-size: clamp(32px, 6vw, 44px);
      margin: 0;
      color: #5d4527;
    }

    .pokemon-desc {
      color: #887451;
      margin: 5px 0 24px;
      font-size: 18px;
    }

    .reason-box {
      text-align: left;
      background: #fff6d9;
      border-radius: 18px;
      padding: 20px 24px;
      margin: 22px 0;
    }

    .reason-box h3,
    .match-box h3 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .reason-box p {
      margin: 7px 0;
    }

    .reason-box p::before {
      content: "✦ ";
      color: #d6a532;
      font-weight: bold;
    }

    .match-box {
      background: #f9efd9;
      border: 2px dashed #e8ce8e;
      border-radius: 18px;
      padding: 20px;
      margin: 20px 0 25px;
    }

    .match-type {
      font-size: 30px;
      font-weight: 900;
      color: #b27621;
    }

    .match-name {
      font-weight: 700;
      font-size: 19px;
      margin: 3px 0;
    }

    .match-desc {
      margin: 8px 0 0;
      color: #78684f;
    }

    .reset-btn {
      background: #e9b94d;
      color: #4e3918;
      border: none;
      border-radius: 15px;
      padding: 15px 30px;
      font-size: 19px;
      font-weight: 900;
      box-shadow: 0 4px 0 #c99a32;
      transition: 0.18s ease;
    }

    .reset-btn:hover {
      background: #f3ca69;
      transform: translateY(-2px);
    }

    .reset-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    footer {
      text-align: center;
      color: #a28d6a;
      font-size: 14px;
      margin-top: 30px;
    }

    @media (max-width: 520px) {
      .container {
        padding: 28px 0;
      }

      .panel {
        padding: 20px 15px;
        border-radius: 20px;
      }

      .mbti-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .mbti-btn {
        padding: 12px 1px;
        font-size: 16px;
        border-radius: 10px;
      }

      .reason-box {
        padding: 17px;
      }

      .subtitle {
        font-size: 16px;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>

      </p>

      <div class="mbti-grid" id="mbtiGrid">

        <button class="mbti-btn" data-type="ISFJ">ISFJ</button>
        <button class="mbti-btn" data-type="INFJ">INFJ</button>
        <button class="mbti-btn" data-type="INTJ">INTJ</button>
        <button class="mbti-btn" data-type="ISTP">ISTP</button>
        <button class="mbti-btn" data-type="ISFP">ISFP</button>
        <button class="mbti-btn" data-type="INFP">INFP</button>
        <button class="mbti-btn" data-type="INTP">INTP</button>
        <button class="mbti-btn" data-type="ESTP">ESTP</button>
        <button class="mbti-btn" data-type="ESFP">ESFP</button>
        <button class="mbti-btn" data-type="ENFP">ENFP</button>
        <button class="mbti-btn" data-type="ENTP">ENTP</button>
        <button class="mbti-btn" data-type="ESTJ">ESTJ</button>
        <button class="mbti-btn" data-type="ESFJ">ESFJ</button>
        <button class="mbti-btn" data-type="ENFJ">ENFJ</button>
        <button class="mbti-btn" data-type="ENTJ">ENTJ</button>
      </div>
    </section>

    <section class="panel result" id="result"
             aria-live="polite" aria-atomic="true">
      <div class="type-label" id="typeLabel">나의 유형</div>

      <div class="pokemon-emoji" id="pokemonEmoji"

      <p class="pokemon-desc" id="pokemonDesc">
        나와 닮은 포켓몬을 소개할게!
      </p>

      <div class="reason-box">
        <h3>💛 나와 닮은 이유</h3>
        <div id="reasons"></div>
      </div>

      <div class="match-box">
        <h3>🤝 나와 잘 맞는 MBTI</h3>
        <div class="match-type" id="matchType">ENFP</div>
        <div class="match-name" id="matchPokemon">
          다른 포켓몬 친구
        </div>
        <p class="match-desc" id="matchDesc"></p>
      </div>

      <button class="reset-btn" id="resetBtn">
        🔄 다시 고르기
      </button>
    </section>

    <footer>
      포켓몬과 MBTI의 조합은 재미를 위한 성격 유형 놀이예요. 🌷
    </footer>
  </main>

        desc: "큰 목표를 세우고 실행하는 전략가",
        reasons: [
          "장기적인 목표를 세우고 적극적으로 실행해요.",
          "문제를 발견하면 해결 방법을 빠르게 찾아요.",
          "도전적인 과제를 통해 자신의 능력을 발휘하는 편이에요."
        ],
        match: "INFP",
        matchPokemon: "뮤",
        matchDesc: "목표를 향해 나아가는 당신과 이상을 소중히 여기는 뮤가 만나면 현실성과 상상력이 조화를 이룰 수 있어요."
      }
    };

    const selection = document.getElementById("selection");
    const result = document.getElementById("result");

    const typeLabel = document.getElementById("typeLabel");
    const pokemonEmoji = document.getElementById("pokemonEmoji");
    const pokemonName = document.getElementById("pokemonName");
    const pokemonDesc = document.getElementById("pokemonDesc");
    const reasons = document.getElementById("reasons");

    const matchType = document.getElementById("matchType");
    const matchPokemon = document.getElementById("matchPokemon");
    const matchDesc = document.getElementById("matchDesc");
    const resetBtn = document.getElementById("resetBtn");

    // 유형 버튼을 누르면 해당 포켓몬을 보여 줘요.
    document.getElementById("mbtiGrid").addEventListener("click", function(event) {
      const button = event.target.closest("button[data-type]");

      if (!button) return;

      const type = button.dataset.type;
      const data = pokemonData[type];

      if (!data) return;

      typeLabel.textContent = "나의 MBTI · " + type;
      pokemonEmoji.textContent = data.emoji;
      pokemonName.textContent = data.pokemon;
      pokemonDesc.textContent = data.desc;

      // 이유를 한 줄씩 안전하게 표시해요.
      reasons.replaceChildren();

      data.reasons.forEach(function(reason) {
        const paragraph = document.createElement("p");
        paragraph.textContent = reason;
        reasons.appendChild(paragraph);
      });

      matchType.textContent = data.match;
      matchPokemon.textContent = "🐾 " + data.matchPokemon;
      matchDesc.textContent = data.matchDesc;

      selection.hidden = true;
      result.classList.add("show");

      // 결과 화면으로 자연스럽게 이동해요.
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    // 다시 고르기 버튼을 누르면 처음 화면으로 돌아가요.
    resetBtn.addEventListener("click", function() {
      result.classList.remove("show");
      selection.hidden = false;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
